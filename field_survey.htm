<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Field Survey · Banglar Bari</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 30%, #24243e 60%, #1a1a3e 100%); min-height: 100vh; padding: 8px; display: flex; justify-content: center; overflow-x: hidden; }
body::before { content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 50%, rgba(99,179,237,0.08) 0%, transparent 50%), radial-gradient(circle at 70% 80%, rgba(183,148,244,0.08) 0%, transparent 50%); animation: floatBg 20s ease-in-out infinite alternate; z-index: 0; }
@keyframes floatBg { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(2%,1%) rotate(3deg); } }

.container { background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); max-width: 480px; width: 100%; border-radius: 20px; padding: 14px 12px 18px; box-shadow: 0 8px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); position: relative; z-index: 1; }

/* HEADER */
.header { text-align: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid rgba(255,255,255,0.06); }
.header h1 { background: linear-gradient(135deg, #63b3ed, #b794f4, #f6ad55, #f6e05e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 17px; font-weight: 800; line-height: 1.2; }
.header p { color: #a0aec0; font-size: 11px; margin-top: 3px; font-weight: 600; }

/* SYNC BANNER */
.sync-banner { background: rgba(72,187,120,0.12); border: 1px solid rgba(72,187,120,0.3); border-radius: 9px; padding: 6px 10px; margin-bottom: 10px; font-size: 10.5px; color: #68d391; display: flex; justify-content: space-between; align-items: center; font-weight: 600; gap: 6px; }
.sync-banner.stale { background: rgba(237,137,54,0.12); border-color: rgba(237,137,54,0.3); color: #f6ad55; }
.sync-banner .refresh-link { color: #63b3ed; cursor: pointer; text-decoration: underline; font-weight: 700; flex-shrink: 0; }
.sync-banner #syncText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* FORM */
.form-group { margin-bottom: 10px; }
label { display: block; font-size: 12px; font-weight: 700; color: #e2e8f0; margin-bottom: 5px; }
.required { color: #fc8181; }
select, input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; font-size: 14px; border: 2px solid rgba(255,255,255,0.08); border-radius: 10px; background: rgba(255,255,255,0.05); color: #fff; font-weight: 500; transition: all 0.2s; }
input::placeholder { color: rgba(255,255,255,0.4); }
select option { background: #1a1a3e; color: #fff; }
input:focus, select:focus { outline: none; border-color: rgba(99,179,237,0.4); background: rgba(255,255,255,0.08); }
input:disabled { opacity: 0.6; cursor: not-allowed; }

.submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; transition: all 0.3s; }
.submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(102,126,234,0.4); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancel { padding: 11px 14px; background: rgba(255,255,255,0.05); color: #a0aec0; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }

/* MESSAGE */
.message { display: none; padding: 10px 14px; border-radius: 10px; text-align: center; font-weight: 700; margin-top: 10px; white-space: pre-line; font-size: 12.5px; animation: slideUp 0.3s ease; }
.message.success { background: rgba(72,187,120,0.15); color: #68d391; border: 1px solid rgba(72,187,120,0.2); }
.message.error { background: rgba(229,62,62,0.15); color: #fc8181; border: 1px solid rgba(229,62,62,0.2); }
.message.info { background: rgba(66,153,225,0.15); color: #63b3ed; border: 1px solid rgba(66,153,225,0.2); }
.message.warning { background: rgba(237,137,54,0.15); color: #f6ad55; border: 1px solid rgba(237,137,54,0.2); }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.hidden { display: none !important; }
.loading { display: inline-block; width: 14px; height: 14px; border: 2.5px solid rgba(255,255,255,0.2); border-radius: 50%; border-top-color: #fff; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* SEARCH */
.search-box { position: relative; display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 0 12px; transition: all 0.2s; margin-bottom: 6px; }
.search-box:focus-within { border-color: rgba(99,179,237,0.5); background: rgba(255,255,255,0.08); }
.search-icon { font-size: 14px; color: rgba(255,255,255,0.5); margin-right: 6px; flex-shrink: 0; }
.search-box input { flex: 1; background: transparent; border: none; padding: 11px 0; color: #fff; font-size: 14px; font-weight: 500; outline: none; width: 100%; }
.search-box input::placeholder { color: rgba(255,255,255,0.35); font-size: 13px; }
.search-clear { background: rgba(229,62,62,0.2); color: #fc8181; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.search-meta { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: #a0aec0; padding: 0 3px 6px 3px; min-height: 14px; }
#searchResultCount { color: #63b3ed; font-weight: 600; }

/* RECORDS */
.records-container { display: flex; flex-direction: column; gap: 9px; margin-top: 10px; }
.record-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 11px; transition: all 0.25s ease; }
.record-card:hover { border-color: rgba(99,179,237,0.3); }
.records-container.has-active .record-card:not(.editing) { display: none !important; }
.record-card.editing { border-color: rgba(99,179,237,0.6); box-shadow: 0 0 0 2px rgba(99,179,237,0.15); background: rgba(99,179,237,0.06); }

.editing-banner { background: linear-gradient(135deg, rgba(99,179,237,0.15), rgba(183,148,244,0.15)); border: 1px solid rgba(99,179,237,0.3); border-radius: 10px; padding: 8px 11px; margin-bottom: 9px; color: #63b3ed; font-size: 11px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.editing-banner .btn-back { background: rgba(255,255,255,0.1); color: #fff; border: none; border-radius: 7px; padding: 4px 10px; font-size: 10.5px; font-weight: 700; cursor: pointer; }

.record-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.08); gap: 6px; }
.record-beneficiary { font-size: 14px; font-weight: 800; color: #fff; }
.record-ref { font-size: 10px; color: #f6e05e; font-weight: 700; margin-top: 2px; }
.edit-btn { padding: 5px 11px; background: linear-gradient(135deg,#63b3ed,#4299e1); color: #fff; border: none; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
.edit-btn.active { background: linear-gradient(135deg,#fc8181,#e53e3e); }

.readonly-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 9px; margin-bottom: 7px; }
.ro-item { font-size: 11px; }
.ro-label { color: #a0aec0; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 1px; }
.ro-value { color: #e2e8f0; font-weight: 600; word-break: break-word; font-size: 11.5px; }

.edit-panel { margin-top: 10px; padding-top: 10px; border-top: 2px solid rgba(99,179,237,0.2); animation: slideDown 0.25s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.edit-panel h4 { color: #63b3ed; font-size: 11.5px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edit-field { display: flex; flex-direction: column; }
.edit-field.full { grid-column: 1 / -1; }
.edit-field label { font-size: 10px; color: #a0aec0; margin-bottom: 3px; font-weight: 600; }
.edit-field input, .edit-field select { padding: 8px 10px; font-size: 13px; }
.edit-field input[readonly] { background: rgba(246,224,94,0.08); color: #f6e05e; font-weight: 700; font-family: monospace; letter-spacing: 0.5px; }

.photo-upload { border: 1.5px dashed rgba(255,255,255,0.15); border-radius: 9px; padding: 8px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.02); position: relative; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; overflow: hidden; }
.photo-upload:hover { border-color: rgba(99,179,237,0.4); background: rgba(99,179,237,0.04); }
.photo-upload.uploading { border-color: #f6ad55; background: rgba(237,137,54,0.06); pointer-events: none; }
.photo-upload.success { border-color: #48bb78; background: rgba(72,187,120,0.08); }
.photo-upload.success .ph-text { color: #68d391; font-weight: 700; }
.photo-upload img { max-width: 100%; max-height: 80px; border-radius: 5px; }
.photo-upload .ph-icon { font-size: 20px; }
.photo-upload .ph-text { font-size: 9.5px; color: rgba(255,255,255,0.4); margin-top: 3px; }
.photo-remove { position: absolute; top: -6px; right: -6px; background: rgba(229,62,62,0.9); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 3; }
.upload-progress-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
.upload-progress-bar .fill { width: 0%; height: 100%; background: linear-gradient(90deg, #f6ad55, #48bb78); transition: width 0.3s ease; }
.upload-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; border: 3px solid rgba(246,224,94,0.2); border-top-color: #f6e05e; border-radius: 50%; animation: spin 0.8s linear infinite; z-index: 2; }
.upload-check { position: absolute; top: 5px; right: 5px; background: #48bb78; color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; z-index: 3; }

.mandatory-photo-label { display: flex; align-items: center; gap: 4px; }
.mandatory-photo-label .dot { width: 6px; height: 6px; border-radius: 50%; background: #fc8181; animation: dotPulse 1.5s ease infinite; }
.mandatory-photo-label .dot.ok { background: #48bb78; animation: none; }
@keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

.required-banner { background: rgba(237,137,54,0.12); border: 1px solid rgba(237,137,54,0.3); border-radius: 9px; padding: 7px 10px; margin-bottom: 9px; font-size: 10.5px; color: #f6ad55; font-weight: 600; }

.meta-info { font-size: 9px; color: rgba(255,255,255,0.35); margin-top: 8px; padding-top: 7px; border-top: 1px dashed rgba(255,255,255,0.06); display: flex; justify-content: space-between; }
.save-row { display: flex; gap: 7px; margin-top: 10px; }
.save-row .submit-btn { margin-top: 0; flex: 1; font-size: 13px; padding: 10px; }
.save-row .btn-cancel { padding: 10px 14px; font-size: 12px; }

.no-records { text-align: center; padding: 24px 16px; color: #a0aec0; font-size: 12.5px; }
.no-records .icon { font-size: 32px; margin-bottom: 8px; }
.no-results-search { text-align: center; padding: 24px 16px; color: #a0aec0; font-size: 12.5px; }
.no-results-search .icon { font-size: 32px; margin-bottom: 8px; }
.no-results-search .query { color: #f6e05e; font-weight: 700; }

.shake { animation: shake 0.5s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

@media (max-width: 360px) {
  .header h1 { font-size: 15px; }
  .edit-grid { grid-template-columns: 1fr; }
  .readonly-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container" id="surveyContainer">
  <div class="header">
    <h1>📋 BBG  VS JOBCARD MAPPING</h1>
    <p>For technical Support plz contact @Akram Mobile-⚠️9733280384</p>
  </div>

  <!-- SYNC BANNER -->
  <div class="sync-banner" id="syncBanner">
    <span id="syncText"><span class="loading"></span> Loading data...</span>
    <span class="refresh-link" onclick="syncFromServer(true)">Refresh</span>
  </div>

  <!-- LOCATION -->
  <div class="form-group">
    <label>📍 Select Location <span class="required">*</span></label>
    <select id="locationSelect" onchange="onLocationChange()">
      <option value="">-- Select Location --</option>
    </select>
  </div>

  <!-- SEARCH -->
  <div id="searchWrapper" class="hidden">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search name, ID, mobile, job card..." oninput="onSearchInput()" autocomplete="off">
      <button class="search-clear hidden" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
    <div class="search-meta">
      <span id="searchResultCount"></span>
      <span id="searchHint" class="hidden">⚡ Instant</span>
    </div>
  </div>

  <!-- EDITING BANNER -->
  <div id="editingBanner" class="editing-banner hidden">
    <span>✏️ <strong>Editing</strong> — others hidden</span>
    <button class="btn-back" onclick="closeAllEdits()">← Back</button>
  </div>

  <!-- RECORDS -->
  <div id="recordsContainer" class="records-container"></div>
  <div id="noRecords" class="hidden no-records">
    <div class="icon">📭</div>
    <div>No records found for this location.</div>
  </div>

  <div id="message" class="message"></div>
</div>

<script>
// ============================================================
// CONFIG — ⚠️ REPLACE WITH YOUR FIELD SURVEY DEPLOYMENT URL
// ============================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoK4fUB32wDZEy6hC2yI-9tt_Bss8M0oL1ets_LGHUdILgGhU9O0Pbqaajs2y1sbwvOA/exec';

// ============================================================
// APP STATE — pulls user/session from localStorage (set by shell)
// ============================================================
const APP = {
  currentUser: null,
  sessionToken: null,
  allRecords: [],
  existingJobCards: new Set(),
  filteredRecords: [],
  currentLocation: '',
  currentQuery: '',
  editingRow: null,
  lastSynced: null,
  isSyncing: false
};

// ============================================================
// FETCH HELPER (with timeout — prevents infinite hang)
// ============================================================
async function apiCall(params, timeoutMs = 45000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(params),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    return await r.json();
  } catch (err) {
    clearTimeout(timeoutId);
    if (err.name === 'AbortError') {
      throw new Error('Request timed out after ' + Math.round(timeoutMs / 1000) + 's. Please check your connection and try again.');
    }
    throw err;
  }
}

// ============================================================
// IMAGE COMPRESSION
// ============================================================
function compressImage(file, maxWidth = 1280, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          let { width, height } = img;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error('Image compression failed'));
          }, 'image/jpeg', quality);
        } catch (err) { reject(err); }
      };
      img.onerror = () => reject(new Error('Invalid image file'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Failed to read file'));
    reader.readAsDataURL(file);
  });
}

// ============================================================
// INIT — reads session from shell's localStorage
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  const t = localStorage.getItem('sessionToken');
  const u = localStorage.getItem('currentUser');

  if (!t || !u) {
    document.getElementById('message').className = 'message error';
    document.getElementById('message').style.display = 'block';
    document.getElementById('message').textContent = '❌ Not authenticated. Please log in from the main app.';
    document.getElementById('syncBanner').classList.add('stale');
    document.getElementById('syncText').textContent = '❌ Not authenticated';
    return;
  }

  APP.sessionToken = t;
  APP.currentUser = JSON.parse(u);
  syncFromServer(false);
});

// ============================================================
// UI HELPERS
// ============================================================
function showMessage(text, type = 'info') {
  const m = document.getElementById('message');
  m.textContent = text;
  m.className = 'message ' + type;
  m.style.display = 'block';
  clearTimeout(m._t);
  m._t = setTimeout(() => m.style.display = 'none', 6000);
}
function hideMessage() { document.getElementById('message').style.display = 'none'; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function formatSyncTime(date) {
  const d = date || new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// ============================================================
// SYNC
// ============================================================
async function syncFromServer(showToast) {
  if (APP.isSyncing) return;
  APP.isSyncing = true;
  const banner = document.getElementById('syncBanner');
  const text = document.getElementById('syncText');
  banner.classList.remove('stale');
  text.innerHTML = '<span class="loading"></span> Loading...';

  try {
    const res = await apiCall({ action: 'get_all_housing_data', sessionToken: APP.sessionToken });
    if (!res.success) {
      banner.classList.add('stale');
      text.textContent = '❌ Failed: ' + (res.message || 'Error');
      showMessage('❌ Sync failed: ' + res.message, 'error');
      APP.isSyncing = false;
      return;
    }

    APP.allRecords = res.data || [];
    APP.existingJobCards = new Set(res.existingJobCards || []);
    APP.lastSynced = new Date();

    populateLocationDropdown(res.locations || []);

    if (APP.currentLocation) {
      applyFilters();
      document.getElementById('searchWrapper').classList.remove('hidden');
    }

    banner.classList.remove('stale');
    text.innerHTML = `✅ <strong>${res.count}</strong> records · ${formatSyncTime(APP.lastSynced)}`;

    if (showToast) showMessage('✅ Data synced!', 'success');
  } catch (err) {
    banner.classList.add('stale');
    text.textContent = '❌ Network error';
    showMessage('❌ Sync failed: ' + err.message, 'error');
  }

  APP.isSyncing = false;
}

function populateLocationDropdown(locations) {
  const sel = document.getElementById('locationSelect');
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">-- Select Location --</option>';
  locations.forEach(loc => {
    const o = document.createElement('option');
    o.value = loc; o.textContent = loc;
    sel.appendChild(o);
  });
  if (currentVal && locations.includes(currentVal)) sel.value = currentVal;
}

// ============================================================
// LOCATION CHANGE
// ============================================================
function onLocationChange() {
  const location = document.getElementById('locationSelect').value;
  APP.currentLocation = location;
  APP.currentQuery = '';
  APP.editingRow = null;

  const container = document.getElementById('recordsContainer');
  container.innerHTML = '';
  container.classList.remove('has-active');
  document.getElementById('editingBanner').classList.add('hidden');
  document.getElementById('noRecords').classList.add('hidden');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.add('hidden');
  document.getElementById('searchHint').classList.add('hidden');

  if (!location) {
    document.getElementById('searchWrapper').classList.add('hidden');
    document.getElementById('searchResultCount').textContent = '';
    return;
  }
  document.getElementById('searchWrapper').classList.remove('hidden');
  applyFilters();
}

// ============================================================
// FILTER
// ============================================================
function applyFilters() {
  const location = APP.currentLocation;
  const query = APP.currentQuery.toLowerCase().trim();
  let filtered = APP.allRecords.filter(r => r.location === location);

  if (query) {
    filtered = filtered.filter(rec => {
      const haystack = [
        rec.beneficiaryName, rec.referenceId, rec.mobileNumber,
        rec.fatherHusbandName, rec.jobCardNo, rec.sansad,
        rec.epicNo, rec.aadharNo, rec.nameAsPerJobCard,
        rec.guardianAsPerJobCard, rec.jobCardVbGram
      ].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(query);
    });
  }

  APP.filteredRecords = filtered;
  renderRecords(filtered);

  const countEl = document.getElementById('searchResultCount');
  const totalForLocation = APP.allRecords.filter(r => r.location === location).length;

  if (query) {
    countEl.textContent = filtered.length === 0
      ? `❌ No matches for "${APP.currentQuery}"`
      : `🔍 ${filtered.length} of ${totalForLocation}`;
  } else {
    countEl.textContent = `📊 ${filtered.length} record${filtered.length !== 1 ? 's' : ''}`;
  }

  if (filtered.length === 0 && !query) {
    document.getElementById('noRecords').classList.remove('hidden');
  } else {
    document.getElementById('noRecords').classList.add('hidden');
  }
}

// ============================================================
// SEARCH
// ============================================================
let searchDebounceTimer = null;
function onSearchInput() {
  const query = document.getElementById('searchInput').value.trim();
  APP.currentQuery = query;
  document.getElementById('searchClear').classList.toggle('hidden', !query);
  document.getElementById('searchHint').classList.toggle('hidden', !query);
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => applyFilters(), 80);
}
function clearSearch() {
  document.getElementById('searchInput').value = '';
  APP.currentQuery = '';
  document.getElementById('searchClear').classList.add('hidden');
  document.getElementById('searchHint').classList.add('hidden');
  applyFilters();
}

// ============================================================
// RENDER RECORDS
// ============================================================
function renderRecords(records) {
  const c = document.getElementById('recordsContainer');
  c.innerHTML = '';
  c.classList.remove('has-active');
  if (records.length === 0) {
    const noRes = document.createElement('div');
    noRes.className = 'no-results-search';
    noRes.innerHTML = `<div class="icon">🔍</div><div>No records match <span class="query">"${esc(APP.currentQuery)}"</span></div>`;
    c.appendChild(noRes);
    return;
  }
  records.forEach(rec => c.appendChild(buildCard(rec)));
}

function buildCard(rec) {
  const card = document.createElement('div');
  card.className = 'record-card';
  card.id = 'card-' + rec.rowIndex;

  const hasEpic = !!rec.epicPhotoLink;
  const hasAadhar = !!rec.aadharPhotoLink;

  const epicPreview = hasEpic
    ? `<img src="${esc(rec.epicPhotoLink)}" alt="EPIC">
       <button class="photo-remove" onclick="event.stopPropagation();removePhoto(${rec.rowIndex},'epic')">✕</button>
       <div class="upload-check">✓</div>`
    : `<span class="ph-icon">📷</span><span class="ph-text">Tap for EPIC Photo</span>`;

  const aadharPreview = hasAadhar
    ? `<img src="${esc(rec.aadharPhotoLink)}" alt="Aadhar">
       <button class="photo-remove" onclick="event.stopPropagation();removePhoto(${rec.rowIndex},'aadhar')">✕</button>
       <div class="upload-check">✓</div>`
    : `<span class="ph-icon">📷</span><span class="ph-text">Tap for Aadhar Photo</span>`;

  const sansadMatch = (rec.sansad || '').match(/(\d+)/);
  const sansadNumVal = sansadMatch ? sansadMatch[1] : '';
  const serialVal = extractSerial(rec.jobCardNo);

  card.innerHTML = `
    <div class="record-header">
      <div style="min-width:0;">
        <div class="record-beneficiary">${esc(rec.beneficiaryName)}</div>
        <div class="record-ref">🆔 ${esc(rec.referenceId)}</div>
      </div>
      <button class="edit-btn" id="editbtn-${rec.rowIndex}" onclick="toggleEdit(${rec.rowIndex})">✏️ Edit</button>
    </div>

    <div class="readonly-grid">
      <div class="ro-item"><div class="ro-label">Location</div><div class="ro-value">${esc(rec.location)}</div></div>
      <div class="ro-item"><div class="ro-label">Father/Husband</div><div class="ro-value">${esc(rec.fatherHusbandName)}</div></div>
      <div class="ro-item"><div class="ro-label">Mobile</div><div class="ro-value">${esc(rec.mobileNumber)}</div></div>
      <div class="ro-item"><div class="ro-label">Job Card VB-G-RAM-G</div><div class="ro-value">${esc(rec.jobCardVbGram)}</div></div>
      <div class="ro-item" style="grid-column:1/-1;"><div class="ro-label">Status of Job Card After Table top</div><div class="ro-value">${esc(rec.statusJobCard)}</div></div>
    </div>

    <div class="edit-panel hidden" id="editpanel-${rec.rowIndex}">
      <h4>✏️ Editable Fields</h4>
      <div class="required-banner">⚠️ Both <strong>EPIC Photo</strong> and <strong>Aadhar Photo</strong> are mandatory.</div>
      <div class="edit-grid">
        <div class="edit-field">
          <label>SANSAD <span style="color:#fc8181;">*</span></label>
          <select id="sansadsel-${rec.rowIndex}" onchange="onSansadSelectChange(${rec.rowIndex})">
            <option value="">-- Select --</option>
            ${buildSansadOptions(sansadNumVal)}
          </select>
        </div>
        <div class="edit-field">
          <label>SERIAL NO <span style="color:#fc8181;">*</span></label>
          <input type="number" min="1" id="serialnum-${rec.rowIndex}" value="${esc(serialVal)}" placeholder="e.g. 15" oninput="onSerialChange(${rec.rowIndex})">
        </div>
        <div class="edit-field full">
          <label>JOB CARD NO (Auto)</label>
          <input type="text" id="jobcard-${rec.rowIndex}" value="${esc(rec.jobCardNo)}" readonly>
        </div>
        <div class="edit-field"><label>NAME AS PER AADHAR</label><input type="text" id="namejc-${rec.rowIndex}" value="${esc(rec.nameAsPerJobCard)}"></div>
        <div class="edit-field"><label>GURDIAN AS PER AADHAR</label><input type="text" id="guardianjc-${rec.rowIndex}" value="${esc(rec.guardianAsPerJobCard)}"></div>
        <div class="edit-field"><label>EPIC NO</label><input type="text" id="epicno-${rec.rowIndex}" value="${esc(rec.epicNo)}"></div>
        <div class="edit-field"><label>AADHAR NO</label><input type="text" id="aadharno-${rec.rowIndex}" value="${esc(rec.aadharNo)}"></div>
        <div class="edit-field">
          <label class="mandatory-photo-label">EPIC PHOTO <span style="color:#fc8181;">*</span><span class="dot ${hasEpic ? 'ok' : ''}" id="epicdot-${rec.rowIndex}"></span></label>
          <div class="photo-upload ${hasEpic ? 'success' : ''}" id="epicarea-${rec.rowIndex}" onclick="triggerPhotoUpload(${rec.rowIndex}, 'epic')">
            ${epicPreview}
            <input type="file" id="epicinput-${rec.rowIndex}" accept="image/*" capture="environment" onchange="handlePhoto(event,${rec.rowIndex},'epic')" style="display:none;">
          </div>
        </div>
        <div class="edit-field">
          <label class="mandatory-photo-label">AADHAR PHOTO <span style="color:#fc8181;">*</span><span class="dot ${hasAadhar ? 'ok' : ''}" id="aadhardot-${rec.rowIndex}"></span></label>
          <div class="photo-upload ${hasAadhar ? 'success' : ''}" id="aadhararea-${rec.rowIndex}" onclick="triggerPhotoUpload(${rec.rowIndex}, 'aadhar')">
            ${aadharPreview}
            <input type="file" id="aadharinput-${rec.rowIndex}" accept="image/*" capture="environment" onchange="handlePhoto(event,${rec.rowIndex},'aadhar')" style="display:none;">
          </div>
        </div>
      </div>
      <div class="meta-info">
        <span>👤 ${esc(rec.userName) || 'N/A'}</span>
        <span>🕐 ${esc(rec.timestamp) || 'N/A'}</span>
      </div>
      <div class="save-row">
        <button class="btn-cancel" onclick="cancelEdit(${rec.rowIndex})">Cancel</button>
        <button class="submit-btn" onclick="saveRecord(${rec.rowIndex})">💾 Save</button>
      </div>
    </div>
  `;

  card.dataset.epicPhoto = rec.epicPhotoLink || '';
  card.dataset.aadharPhoto = rec.aadharPhotoLink || '';
  return card;
}

// ============================================================
// HELPERS
// ============================================================
function buildSansadOptions(selectedNum) {
  let html = '';
  for (let i = 1; i <= 30; i++) {
    const sel = String(selectedNum) === String(i) ? ' selected' : '';
    html += `<option value="${i}"${sel}>SANSAD/${i}</option>`;
  }
  return html;
}
function extractSerial(jobCardNo) {
  if (!jobCardNo) return '';
  const m = String(jobCardNo).match(/\/(\d+)$/);
  return m ? m[1] : '';
}

// ============================================================
// EDIT TOGGLE
// ============================================================
function toggleEdit(rowIndex) {
  const panel = document.getElementById('editpanel-' + rowIndex);
  const btn = document.getElementById('editbtn-' + rowIndex);
  const card = document.getElementById('card-' + rowIndex);
  const container = document.getElementById('recordsContainer');
  const banner = document.getElementById('editingBanner');
  const isCurrentlyOpen = !panel.classList.contains('hidden');

  document.querySelectorAll('.edit-panel').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.edit-btn').forEach(b => { b.classList.remove('active'); b.textContent = '✏️ Edit'; });
  document.querySelectorAll('.record-card').forEach(c => c.classList.remove('editing'));

  if (!isCurrentlyOpen) {
    panel.classList.remove('hidden');
    btn.classList.add('active');
    btn.textContent = '✖ Close';
    card.classList.add('editing');
    container.classList.add('has-active');
    banner.classList.remove('hidden');
    APP.editingRow = rowIndex;
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  } else {
    container.classList.remove('has-active');
    banner.classList.add('hidden');
    APP.editingRow = null;
  }
}

function cancelEdit(rowIndex) {
  document.getElementById('editpanel-' + rowIndex).classList.add('hidden');
  const btn = document.getElementById('editbtn-' + rowIndex);
  btn.classList.remove('active');
  btn.textContent = '✏️ Edit';
  document.getElementById('card-' + rowIndex).classList.remove('editing');
  document.getElementById('recordsContainer').classList.remove('has-active');
  document.getElementById('editingBanner').classList.add('hidden');
  APP.editingRow = null;
}

function closeAllEdits() {
  document.querySelectorAll('.edit-panel').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.edit-btn').forEach(b => { b.classList.remove('active'); b.textContent = '✏️ Edit'; });
  document.querySelectorAll('.record-card').forEach(c => c.classList.remove('editing'));
  document.getElementById('recordsContainer').classList.remove('has-active');
  document.getElementById('editingBanner').classList.add('hidden');
  APP.editingRow = null;
  setTimeout(() => document.getElementById('recordsContainer').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

// ============================================================
// JOB CARD GENERATION
// ============================================================
function onSansadSelectChange(rowIndex) {
  const sansadNum = document.getElementById('sansadsel-' + rowIndex).value;
  const serialInput = document.getElementById('serialnum-' + rowIndex);
  if (!sansadNum) { document.getElementById('jobcard-' + rowIndex).value = ''; return; }
  if (serialInput.value) generateJobCard(rowIndex);
}
function onSerialChange(rowIndex) {
  const sansadNum = document.getElementById('sansadsel-' + rowIndex).value;
  const serialNum = document.getElementById('serialnum-' + rowIndex).value;
  if (!sansadNum || !serialNum) { document.getElementById('jobcard-' + rowIndex).value = ''; return; }
  generateJobCard(rowIndex);
}
function generateJobCard(rowIndex) {
  const sansadNum = parseInt(document.getElementById('sansadsel-' + rowIndex).value);
  const serialNum = parseInt(document.getElementById('serialnum-' + rowIndex).value);
  if (!sansadNum || !serialNum) return;
  const sansadPadded = String(sansadNum).padStart(3, '0');
  const jobCard = `WB-09-003-002-${sansadPadded}/${serialNum}`;
  document.getElementById('jobcard-' + rowIndex).value = jobCard;

  const jcInput = document.getElementById('jobcard-' + rowIndex);
  let duplicateRow = null;
  for (const rec of APP.allRecords) {
    if (rec.rowIndex === rowIndex) continue;
    if (rec.jobCardNo === jobCard) { duplicateRow = rec.rowIndex; break; }
  }
  if (duplicateRow) {
    showMessage('⚠️ Job Card already exists (Row ' + duplicateRow + ')', 'warning');
    jcInput.style.borderColor = '#fc8181';
  } else {
    jcInput.style.borderColor = '';
  }
}

// ============================================================
// PHOTO UPLOAD
// ============================================================
function triggerPhotoUpload(rowIndex, type) {
  const input = document.getElementById((type === 'epic' ? 'epicinput-' : 'aadharinput-') + rowIndex);
  if (input) input.click();
}

async function handlePhoto(event, rowIndex, type) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    showMessage('❌ Please select an image file.', 'error');
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    showMessage('❌ Image too large (' + (file.size / 1024 / 1024).toFixed(1) + 'MB). Max 8MB.', 'error');
    return;
  }

  const areaId = type === 'epic' ? 'epicarea-' : 'aadhararea-';
  const dotId = type === 'epic' ? 'epicdot-' : 'aadhardot-';
  const area = document.getElementById(areaId + rowIndex);
  const dot = document.getElementById(dotId + rowIndex);

  const rec = APP.allRecords.find(r => r.rowIndex === rowIndex);
  const referenceId = rec ? rec.referenceId : 'UNKNOWN';
  const photoType = type === 'epic' ? 'EPIC' : 'AADHAR';

  area.classList.remove('success');
  area.classList.add('uploading');
  area.innerHTML = `
    <div class="upload-spinner"></div>
    <span class="ph-icon" style="opacity:0.3;">📷</span>
    <span class="ph-text" style="color:#f6ad55;font-weight:700;">Compressing & uploading...</span>
    <div class="upload-progress-bar"><div class="fill" id="progress-${rowIndex}-${type}"></div></div>
    <input type="file" id="${type}input-${rowIndex}" accept="image/*" capture="environment" onchange="handlePhoto(event,${rowIndex},'${type}')" style="display:none;">
  `;

  const progressFill = document.getElementById(`progress-${rowIndex}-${type}`);
  let prog = 0;
  const progressInterval = setInterval(() => {
    if (prog < 85 && progressFill) {
      prog += Math.random() * 8;
      progressFill.style.width = Math.min(prog, 85) + '%';
    }
  }, 150);

  function resetUploadArea(errMsg) {
    clearInterval(progressInterval);
    area.classList.remove('uploading', 'success');
    area.innerHTML = `
      <span class="ph-icon">📷</span>
      <span class="ph-text">Tap for ${photoType} Photo</span>
      <input type="file" id="${type}input-${rowIndex}" accept="image/*" capture="environment" onchange="handlePhoto(event,${rowIndex},'${type}')" style="display:none;">
    `;
    if (dot) dot.classList.remove('ok');
    if (errMsg) showMessage('❌ ' + errMsg, 'error');
  }

  try {
    const compressedBlob = await compressImage(file, 1280, 0.72);

    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (ev) => resolve(ev.target.result.split(',')[1]);
      reader.onerror = () => reject(new Error('Failed to read compressed image'));
      reader.readAsDataURL(compressedBlob);
    });

    const res = await apiCall({
      action: 'upload_photo',
      fileData: base64,
      fileType: 'image/jpeg',
      referenceId: referenceId,
      photoType: photoType,
      sessionToken: APP.sessionToken
    }, 90000);

    clearInterval(progressInterval);

    if (res && res.success && res.fileUrl) {
      if (progressFill) progressFill.style.width = '100%';
      setTimeout(() => {
        area.classList.remove('uploading');
        area.classList.add('success');
        area.innerHTML = `
          <img src="${res.fileUrl}" alt="${photoType}">
          <button class="photo-remove" onclick="event.stopPropagation();removePhoto(${rowIndex},'${type}')">✕</button>
          <div class="upload-check">✓</div>
          <input type="file" id="${type}input-${rowIndex}" accept="image/*" capture="environment" onchange="handlePhoto(event,${rowIndex},'${type}')" style="display:none;">
        `;
        if (dot) dot.classList.add('ok');
        const card = document.getElementById('card-' + rowIndex);
        if (card) card.dataset[type + 'Photo'] = res.fileUrl;
        showMessage(`✅ ${photoType} uploaded`, 'success');
        setTimeout(hideMessage, 2000);
      }, 300);
    } else {
      resetUploadArea((res && (res.error || res.message)) || 'Server rejected the upload');
    }
  } catch (err) {
    console.error('Photo upload error:', err);
    resetUploadArea(err.message || 'Network error');
  }
}

function removePhoto(rowIndex, type) {
  const area = document.getElementById((type === 'epic' ? 'epicarea-' : 'aadhararea-') + rowIndex);
  const dot = document.getElementById((type === 'epic' ? 'epicdot-' : 'aadhardot-') + rowIndex);
  const label = type === 'epic' ? 'EPIC Photo' : 'Aadhar Photo';
  area.classList.remove('success', 'uploading');
  area.innerHTML = `<span class="ph-icon">📷</span><span class="ph-text">Tap for ${label}</span><input type="file" id="${type}input-${rowIndex}" accept="image/*" capture="environment" onchange="handlePhoto(event,${rowIndex},'${type}')" style="display:none;">`;
  if (dot) dot.classList.remove('ok');
  document.getElementById('card-' + rowIndex).dataset[type + 'Photo'] = '';
}

// ============================================================
// SAVE RECORD
// ============================================================
async function saveRecord(rowIndex) {
  const sansadNum = document.getElementById('sansadsel-' + rowIndex).value;
  const serialNum = document.getElementById('serialnum-' + rowIndex).value;
  const jobCardNo = document.getElementById('jobcard-' + rowIndex).value;

  if (!sansadNum) { showMessage('❌ Select SANSAD.', 'error'); return; }
  if (!serialNum) { showMessage('❌ Enter serial number.', 'error'); return; }
  if (!jobCardNo) { showMessage('❌ Job Card not generated.', 'error'); return; }

  const card = document.getElementById('card-' + rowIndex);
  const epicUrl = card.dataset.epicPhoto || '';
  const aadharUrl = card.dataset.aadharPhoto || '';

  if (!epicUrl && !aadharUrl) { shakeBoth(rowIndex); showMessage('⚠️ Both photos mandatory!', 'error'); return; }
  if (!epicUrl) { shakePhoto(rowIndex, 'epic'); showMessage('⚠️ EPIC Photo mandatory!', 'error'); return; }
  if (!aadharUrl) { shakePhoto(rowIndex, 'aadhar'); showMessage('⚠️ Aadhar Photo mandatory!', 'error'); return; }

  const rec = APP.allRecords.find(r => r.rowIndex === rowIndex);
  const payload = {
    rowIndex: rowIndex,
    referenceId: rec.referenceId,
    sansad: 'SANSAD/' + sansadNum,
    jobCardNo: jobCardNo,
    nameAsPerJobCard: document.getElementById('namejc-' + rowIndex).value.trim(),
    guardianAsPerJobCard: document.getElementById('guardianjc-' + rowIndex).value.trim(),
    epicNo: document.getElementById('epicno-' + rowIndex).value.trim(),
    epicPhotoLink: epicUrl,
    aadharNo: document.getElementById('aadharno-' + rowIndex).value.trim(),
    aadharPhotoLink: aadharUrl
  };

  const saveBtn = document.querySelector(`#editpanel-${rowIndex} .submit-btn`);
  const originalText = saveBtn.innerHTML;
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="loading"></span> Saving...';

  try {
    const res = await apiCall({
      action: 'update_housing_record',
      data: JSON.stringify(payload),
      sessionToken: APP.sessionToken,
      userName: APP.currentUser.name
    });

    if (res.success) {
      const idx = APP.allRecords.findIndex(r => r.rowIndex === rowIndex);
      if (idx !== -1) Object.assign(APP.allRecords[idx], res.data.updatedFields);
      if (res.data.updatedFields.jobCardNo) APP.existingJobCards.add(res.data.updatedFields.jobCardNo);

      closeAllEdits();
      showMessage('✅ ' + res.message + '\n👤 ' + APP.currentUser.name, 'success');

      applyFilters();

      setTimeout(() => {
        const newCard = document.getElementById('card-' + rowIndex);
        if (newCard) {
          newCard.style.transition = 'box-shadow 0.3s';
          newCard.style.boxShadow = '0 0 0 2px rgba(72,187,120,0.6)';
          setTimeout(() => { newCard.style.boxShadow = ''; }, 1500);
        }
      }, 100);
    } else {
      showMessage('❌ ' + res.message, 'error');
      saveBtn.disabled = false;
      saveBtn.innerHTML = originalText;
    }
  } catch (err) {
    showMessage('❌ ' + err.message, 'error');
    saveBtn.disabled = false;
    saveBtn.innerHTML = originalText;
  }
}

function shakePhoto(rowIndex, type) {
  const el = document.getElementById((type === 'epic' ? 'epicarea-' : 'aadhararea-') + rowIndex);
  if (!el) return;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 500);
}
function shakeBoth(rowIndex) {
  shakePhoto(rowIndex, 'epic');
  setTimeout(() => shakePhoto(rowIndex, 'aadhar'), 150);
}

console.log('✅ Field Survey module loaded');
</script>
